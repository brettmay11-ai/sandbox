<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In | NFL Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#070a0f;color:#fff}
h1{font-family:'Anton','Inter',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.field{position:fixed;inset:0;overflow:hidden;background:#07101c url('assets/login-stadium.png') center center/cover no-repeat}
.field:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,10,20,.62),rgba(3,10,20,.18) 48%,rgba(3,10,20,.46)),linear-gradient(180deg,rgba(2,8,17,.12),rgba(2,8,17,.7));}
.field:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 0 34%,rgba(2,8,17,.34) 100%);pointer-events:none}
.login-shell{position:relative;z-index:2;overflow:hidden;border-radius:12px;background:rgba(8,13,21,.9);border:1px solid rgba(255,255,255,.15);box-shadow:0 28px 80px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(16px)}
.login-shell:before{content:'';position:absolute;inset:0 0 auto;height:96px;background:linear-gradient(95deg,rgba(1,51,105,.42),rgba(255,255,255,.035),rgba(213,10,10,.22));pointer-events:none}
.logo-wrap{background:#fff;border:4px solid #d50a0a;box-shadow:0 0 0 7px #013369,0 18px 34px rgba(0,0,0,.28)}
.input-wrap{border-radius:8px}
.input-wrap:focus-within{border-color:#5b9bd5;background:rgba(91,155,213,.08);box-shadow:0 0 0 3px rgba(91,155,213,.1)}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #111a25 inset;-webkit-text-fill-color:#fff}
.submit-btn{border-radius:8px;box-shadow:0 12px 28px rgba(1,51,105,.28)}
.submit-btn:disabled{opacity:.65;cursor:wait}
@media(max-width:640px){.field{background-position:center center}.field:before{background:linear-gradient(90deg,rgba(3,10,20,.72),rgba(3,10,20,.28) 70%),linear-gradient(180deg,rgba(2,8,17,.18),rgba(2,8,17,.72))}.login-shell{max-width:420px}}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">
<div class="field" aria-hidden="true">
</div>
<main class="login-shell w-full max-w-[440px]">
  <div class="h-2 bg-[#d50a0a]"></div>
  <div class="px-6 pt-8 pb-6 sm:px-9 sm:pt-10 text-center border-b border-white/10">
    <div class="logo-wrap w-20 h-20 mx-auto mb-6 grid place-items-center rounded-full">
      <img src="https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png" alt="NFL shield" class="w-12 h-14 object-contain">
    </div>
    <p class="text-[10px] uppercase font-bold tracking-[.24em] text-[#5b9bd5]">Classroom Portal</p>
    <h1 class="text-3xl sm:text-4xl font-black mt-2">NFL Classroom</h1>
    <p class="text-sm text-white/45 mt-3 leading-relaxed">Follow your team. Build your skills. Earn XP.</p>
  </div>
  <form id="login-form" class="p-6 sm:p-9 space-y-5">
    <label class="block"><span class="text-[11px] uppercase font-bold tracking-wider text-white/50">Username</span><div class="input-wrap mt-2 flex items-center border border-white/12 bg-white/[.035] transition"><iconify-icon icon="lucide:user" class="ml-4 text-white/35"></iconify-icon><input id="username" autocomplete="username" required maxlength="32" autofocus class="w-full bg-transparent px-3 py-3.5 outline-none text-sm" placeholder="Enter your username"></div></label>
    <label class="block"><span class="text-[11px] uppercase font-bold tracking-wider text-white/50">PIN</span><div class="input-wrap mt-2 flex items-center border border-white/12 bg-white/[.035] transition"><iconify-icon icon="lucide:lock-keyhole" class="ml-4 text-white/35"></iconify-icon><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required minlength="4" maxlength="8" pattern="[0-9]{4,8}" class="w-full bg-transparent px-3 py-3.5 text-lg tracking-[.3em] outline-none" placeholder="••••"></div></label>
    <div id="message" role="alert" class="hidden p-3 text-sm border"></div>
    <button id="submit" class="submit-btn w-full bg-[#013369] hover:bg-[#084b8a] border border-[#5b9bd5]/40 py-3.5 font-bold transition flex items-center justify-center gap-2"><iconify-icon icon="lucide:log-in"></iconify-icon><span>Enter the Classroom</span></button>
    <p class="text-center text-[11px] text-white/35">Use the username and PIN provided by your teacher.</p>
  </form>
  <div class="px-6 py-4 border-t border-white/10 flex items-center justify-center gap-2 text-[10px] uppercase tracking-wider text-white/25"><iconify-icon icon="lucide:shield-check"></iconify-icon> Classroom accounts only</div>
</main>
<script>
const form=document.getElementById('login-form'),message=document.getElementById('message'),submit=document.getElementById('submit');
form.addEventListener('submit',async event=>{event.preventDefault();message.classList.add('hidden');submit.disabled=true;submit.innerHTML='<iconify-icon icon="lucide:loader-circle" class="animate-spin"></iconify-icon><span>Signing in...</span>';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,pin:document.getElementById('pin').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not sign in.');window.location.href=data.redirectPath||'/';}catch(error){message.textContent=error.message;message.className='p-3 text-sm bg-red-500/10 border border-red-500/30 text-red-300';}finally{submit.disabled=false;submit.innerHTML='<iconify-icon icon="lucide:log-in"></iconify-icon><span>Enter the Classroom</span>';}});
</script>
</body>
</html>
